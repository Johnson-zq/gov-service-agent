[project]
name = "gov-service-agent"
version = "0.1.0"
description = "政务大厅全过程智能办事 Agent"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2,<3",
    "pydantic-settings>=2.0",
    "python-dotenv>=0.21",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring Docker PostgreSQL and TEST_DATABASE_URL",
]
